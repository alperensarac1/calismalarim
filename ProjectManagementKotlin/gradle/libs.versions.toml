[versions]

# ---------------------------------------------------------
# Proje derleme araçları
# ---------------------------------------------------------

agp = "8.7.3"
kotlin = "1.9.24"
hilt = "2.52"

# ---------------------------------------------------------
# AndroidX temel bileşenleri
# ---------------------------------------------------------

coreKtx = "1.16.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.10.1"
fragment = "1.8.5"
constraintLayout = "2.2.1"
recyclerView = "1.4.0"
swipeRefreshLayout = "1.1.0"

# ---------------------------------------------------------
# Lifecycle ve Navigation
# ---------------------------------------------------------

lifecycle = "2.8.7"
navigation = "2.8.5"

# ---------------------------------------------------------
# Network
# ---------------------------------------------------------

retrofit = "2.11.0"
okhttp = "4.12.0"

# ---------------------------------------------------------
# Kotlin
# ---------------------------------------------------------

coroutines = "1.8.1"
serializationJson = "1.6.3"

# ---------------------------------------------------------
# Veri saklama ve arka plan işlemleri
# ---------------------------------------------------------

dataStore = "1.1.1"
paging = "3.3.5"
workManager = "2.10.0"

# ---------------------------------------------------------
# Görsel yükleme
# ---------------------------------------------------------

coil = "2.7.0"

# ---------------------------------------------------------
# Test
# ---------------------------------------------------------

junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
mockk = "1.13.13"
coroutinesTest = "1.8.1"
archCoreTesting = "2.2.0"


[libraries]

# ---------------------------------------------------------
# AndroidX temel bileşenleri
# ---------------------------------------------------------

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }

androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }

androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }

androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerView" }

androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swipeRefreshLayout" }

# ---------------------------------------------------------
# Lifecycle
# ---------------------------------------------------------

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }

androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }

androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

# ---------------------------------------------------------
# Navigation Component
# ---------------------------------------------------------

androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }

androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# ---------------------------------------------------------
# Retrofit ve OkHttp
# ---------------------------------------------------------

retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }

retrofit-kotlinx-serialization-converter = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

okhttp-core = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# ---------------------------------------------------------
# Kotlin Coroutines ve Serialization
# ---------------------------------------------------------

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# ---------------------------------------------------------
# Hilt
# ---------------------------------------------------------

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }

hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# ---------------------------------------------------------
# DataStore
# ---------------------------------------------------------

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "dataStore" }

# ---------------------------------------------------------
# Paging 3
# ---------------------------------------------------------

androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }

# ---------------------------------------------------------
# WorkManager
# ---------------------------------------------------------

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }

# ---------------------------------------------------------
# Coil
# ---------------------------------------------------------

coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }

# ---------------------------------------------------------
# Unit test
# ---------------------------------------------------------

junit = { group = "junit", name = "junit", version.ref = "junit" }

mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }

# ---------------------------------------------------------
# Instrumented test
# ---------------------------------------------------------

androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }

androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }


[bundles]

lifecycle = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-viewmodel-ktx",
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-process"
]

navigation = [
    "androidx-navigation-fragment-ktx",
    "androidx-navigation-ui-ktx"
]

network = [
    "retrofit-core",
    "retrofit-kotlinx-serialization-converter",
    "okhttp-core",
    "okhttp-logging-interceptor"
]

coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android"
]


[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }